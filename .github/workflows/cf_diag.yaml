# TEMPORARY diagnostic: check what the repo API token can do on the two existing zones
# (read-only: zone status, email routing catch-all, required DNS records, dns_records).
# Delete after use.
name: CF Diag (temp)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check token permissions on existing zones
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          for zid in 4ca69606a5fa06396a9cf7cb9412b7d7 920e440a6f323f171e4c24f26943ba64; do
            echo "===== zone $zid ====="
            echo "-- zone --"
            curl -s "${AUTH[@]}" "$API/zones/$zid" | jq -c '{success, name: .result.name, status: .result.status, errors}'
            echo "-- routing catch_all --"
            curl -s "${AUTH[@]}" "$API/zones/$zid/email/routing/rules/catch_all" | jq -c .
            echo "-- routing dns (required records) --"
            curl -s "${AUTH[@]}" "$API/zones/$zid/email/routing/dns" | jq -c .
            echo "-- dns_records (first 10) --"
            curl -s "${AUTH[@]}" "$API/zones/$zid/dns_records?per_page=10" | jq -c '{success, count: (.result | length), errors, records: [.result[] | .type + " " + .name + " " + .content]}'
          done
